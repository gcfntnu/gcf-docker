name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  # mirflowz environment.yml: python>=3.12, snakemake>=8, pulp, graphviz
  - python=3.12
  - snakemake-minimal=9.27.1
  - pulp=3.3.2
  - graphviz
  - pandas=2.3.3
  # tools of mirflowz v0.10.0 (versions of its workflow/envs and rule containers)
  # segemehl: from mirflowz's pinned container (see the Dockerfile), not from here
  - oligomap=1.0.1
  - cutadapt=5.0
  - fastx_toolkit=0.0.14
  - bedtools=2.31.1
  - samtools=1.21
  - pysam=0.23.0
  - gffutils=0.13
  - biopython=1.88
  - perl
  # R 4.2 and optparse 1.7: scripts/merge_tables.R declares --prefix as a flag (store_true) but
  # passes it a value; optparse 1.8 rejects that, 1.7 (mirflowz's R image has 1.7.1) accepts it.
  # conda-forge builds optparse < 1.8 only up to R 4.2.
  - r-base=4.2
  - r-optparse=1.7.5
  - bioconductor-rtracklayer
  - r-tidyverse
