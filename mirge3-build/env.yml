name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - bowtie=1.3.1          # the version in the miRge3 0.1.4 quantification image (biocontainer)
  - bcftools=1.25
  - htslib=1.25
  - bedtools=2.31.1
  - samtools=1.25
  - biopython=1.88        # needed by miRge-build (checked in the build)
  - scipy=1.15.2
  - curl
  - pigz
