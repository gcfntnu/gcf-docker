# Direct dependencies of gcfntnu/r-default (build 4.5.3, 2026-11-06).
# Bump versions deliberately, rebuild under a new tag and regenerate packages.txt:
#   docker run --rm gcfntnu/r-default:<tag> conda list --export > packages.txt
# The full resolved environment of a build is recorded in packages.txt.
name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  # Keep R and conda of gcfntnu/r-base-conda:4.5.3.
  - r-base=4.5.3
  - conda=26.7.1
  - mscorefonts=0.0.1
  - font-ttf-ubuntu
  - r-argparse=2.3.3
  - r-optparse=1.8.2
  - r-tidyverse=2.0.0
  - r-data.table=1.18.6.1
  - r-ggpubr=1.0.0
  - r-cairo=1.7_0
  - r-hdf5r=1.3.16
  - r-rcurl=1.98_1.19
  - r-xml=3.99_0.25
