name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - tiny-count=1.6.0
  # tinyRNA 1.6.0's tested versions (conda/environment_3.10.yml upstream); the bioconda recipe does not pin
  # them, and with HTSeq 2.1 tiny-count fails on every GFF ('dict' object has no attribute 'contains_ident').
  - htseq=2.0.3
  - pandas=2.0.2
  - numpy=1.24.3
  - bowtie=1.3.1
  - samtools=1.25
