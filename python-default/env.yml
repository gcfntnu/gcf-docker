# Direct dependencies of gcfntnu/python-default (build 3.12-1, 2026-11-05).
# Bump versions deliberately, rebuild under a new tag and regenerate packages.txt:
#   docker run --rm gcfntnu/python-default:<tag> conda list --export > packages.txt
# The full resolved environment of a build is recorded in packages.txt.
name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.14
  # Keep the conda of gcfntnu/python-base-conda:3.12; without this pin `conda env update`
  # upgrades conda and breaks its bundled conda-anaconda-telemetry plugin.
  - conda=26.7.1
  - pip=26.2.2
  - numpy=2.5.4
  - pandas=3.1.1
  - polars=1.44.2  # stay on 1.x; polars 2 changes the API, upgrade separately
  - scipy=1.18.1
  - pyyaml=6.0.3
  - peppy=0.40.8
  - openpyxl=3.1.5
  - jinja2=3.1.6
  - lxml=6.1.3
  - html5lib=1.1
  - matplotlib=3.11.2
  - pytables=3.11.1
  - pyreadstat=1.3.7
  - tabulate=0.10.0
  - zlib=1.3.2
  - blosc=1.21.7
  - fsspec=2026.9.0
  - numba=0.68.1
  - pyarrow=26.0.1
  - fastparquet=2026.5.0
  - gcsfs=2026.10.1
  - s3fs=2026.9.0
  - beautifulsoup4=4.15.0
  - bottleneck=1.6.0
  - numexpr=2.14.2
  - csvkit=2.2.0
  - upsetplot=0.9.0
  - xlsxwriter=3.2.9
  - pip:
    - pyxcelframe==1.6
